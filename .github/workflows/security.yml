name: Security and reproducibility gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Check out complete history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Run mandatory gates
        # UTF-8 stdout: the gates print bilingual messages, and on the
        # cp1252 runner console a failure report would crash before it
        # could say what failed (observed 2026-10-14).
        env:
          PYTHONUTF8: "1"
        run: python scripts/run_all_checks.py
